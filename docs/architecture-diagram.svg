<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 725" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead" />
    </marker>
  </defs>

  <style>
    svg { background: #ffffff; }
    .title { font-size: 22px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 13px; fill: #6b7280; }
    .ours { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.5; }
    .external { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.5; }
    .optional { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .box-title { font-size: 14px; font-weight: 600; fill: #111827; }
    .box-sub { font-size: 11.5px; fill: #4b5563; }
    .arrowhead { fill: #374151; }
    .arrow-solid { stroke: #374151; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .arrow-dashed { stroke: #6b7280; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    .arrow-label { font-size: 11px; fill: #4b5563; }
    .legend-text { font-size: 12px; fill: #374151; }

    @media (prefers-color-scheme: dark) {
      svg { background: #0f1115; }
      .title { fill: #f3f4f6; }
      .subtitle { fill: #9ca3af; }
      .ours { fill: #241f47; stroke: #8b83f5; }
      .external { fill: #1f2430; stroke: #9ca3af; }
      .optional { fill: #14161c; stroke: #6b7280; }
      .box-title { fill: #f3f4f6; }
      .box-sub { fill: #cbd5e1; }
      .arrowhead { fill: #cbd5e1; }
      .arrow-solid { stroke: #cbd5e1; }
      .arrow-dashed { stroke: #9ca3af; }
      .arrow-label { fill: #cbd5e1; }
      .legend-text { fill: #cbd5e1; }
    }
  </style>

  <text x="500" y="30" text-anchor="middle" class="title">Multistage AI Chat Agent — Architecture</text>
  <text x="500" y="48" text-anchor="middle" class="subtitle">One chat turn, end to end</text>

  <!-- 1. Browser -->
  <rect x="380" y="65" width="240" height="55" rx="8" class="ours" />
  <text x="500" y="88" text-anchor="middle" class="box-title">React Chat UI</text>
  <text x="500" y="105" text-anchor="middle" class="box-sub">sessionId in localStorage</text>

  <path d="M500,120 L500,160" class="arrow-solid" />
  <text x="512" y="143" class="arrow-label">POST /chat</text>

  <!-- 2. chatController -->
  <rect x="380" y="160" width="240" height="55" rx="8" class="ours" />
  <text x="500" y="183" text-anchor="middle" class="box-title">chatController</text>
  <text x="500" y="200" text-anchor="middle" class="box-sub">Zod-validates {sessionId, message}</text>

  <!-- Mongo (optional) branch, left -->
  <rect x="90" y="160" width="220" height="55" rx="8" class="optional" />
  <text x="200" y="183" text-anchor="middle" class="box-title">MongoDB (optional)</text>
  <text x="200" y="200" text-anchor="middle" class="box-sub">transcript / audit log</text>
  <path d="M380,187 L318,187" class="arrow-dashed" />

  <!-- sessionService + Redis branch, right -->
  <rect x="690" y="160" width="220" height="50" rx="8" class="ours" />
  <text x="800" y="181" text-anchor="middle" class="box-title">sessionService</text>
  <text x="800" y="197" text-anchor="middle" class="box-sub">getOrCreateSession / updateSession</text>
  <path d="M620,185 L682,185" class="arrow-solid" />

  <rect x="690" y="245" width="220" height="50" rx="8" class="external" />
  <text x="800" y="266" text-anchor="middle" class="box-title">Redis</text>
  <text x="800" y="282" text-anchor="middle" class="box-sub">history + stage, sliding TTL</text>
  <path d="M800,210 L800,237" class="arrow-dashed" />

  <path d="M500,215 L500,255" class="arrow-solid" />

  <!-- 3. agentService -->
  <rect x="380" y="255" width="240" height="55" rx="8" class="ours" />
  <text x="500" y="278" text-anchor="middle" class="box-title">agentService</text>
  <text x="500" y="295" text-anchor="middle" class="box-sub">2-call design, see ARCHITECTURE.md §3</text>

  <!-- Groq branch, right -->
  <rect x="700" y="325" width="260" height="88" rx="8" class="external" />
  <text x="830" y="347" text-anchor="middle" class="box-title">Groq API</text>
  <text x="830" y="363" text-anchor="middle" class="box-sub">openai/gpt-oss-120b</text>
  <text x="830" y="378" text-anchor="middle" class="box-sub">① classify stage (no tools, JSON)</text>
  <text x="830" y="392" text-anchor="middle" class="box-sub">② tool-call loop (stage-scoped tools)</text>

  <path d="M620,270 L696,352" class="arrow-dashed" />
  <circle cx="644" cy="299" r="9" class="ours" />
  <text x="644" y="303" text-anchor="middle" class="box-sub" font-weight="600">①</text>

  <path d="M620,296 L696,385" class="arrow-dashed" />
  <circle cx="638" cy="356" r="9" class="ours" />
  <text x="638" y="360" text-anchor="middle" class="box-sub" font-weight="600">②</text>

  <path d="M500,310 L500,350" class="arrow-solid" />

  <!-- 4. toolRegistry -->
  <rect x="380" y="350" width="240" height="55" rx="8" class="ours" />
  <text x="500" y="373" text-anchor="middle" class="box-title">toolRegistry</text>
  <text x="500" y="390" text-anchor="middle" class="box-sub">stage → tool dispatch + Zod validation</text>

  <path d="M500,405 L500,450" class="arrow-solid" />

  <!-- 5. Zoho services layer -->
  <rect x="340" y="450" width="320" height="60" rx="8" class="ours" />
  <text x="500" y="473" text-anchor="middle" class="box-title">services/zoho/*</text>
  <text x="500" y="490" text-anchor="middle" class="box-sub">leadsService · dealsService · contactsService · casesService</text>

  <path d="M500,510 L500,555" class="arrow-dashed" />
  <text x="512" y="536" class="arrow-label">axios + OAuth access token</text>

  <!-- 6. Zoho CRM -->
  <rect x="290" y="555" width="420" height="72" rx="8" class="external" />
  <text x="500" y="580" text-anchor="middle" class="box-title">Zoho CRM API</text>
  <text x="500" y="597" text-anchor="middle" class="box-sub">OAuth 2.0 Self Client</text>
  <text x="500" y="613" text-anchor="middle" class="box-sub">Leads · Deals · Contacts · Cases</text>

  <!-- Legend -->
  <g transform="translate(90, 680)">
    <rect x="0" y="0" width="18" height="18" rx="4" class="ours" />
    <text x="26" y="14" class="legend-text">Code in this repo</text>

    <rect x="170" y="0" width="18" height="18" rx="4" class="external" />
    <text x="196" y="14" class="legend-text">External service</text>

    <rect x="330" y="0" width="18" height="18" rx="4" class="optional" />
    <text x="356" y="14" class="legend-text">Optional</text>

    <path d="M470,9 L520,9" class="arrow-solid" />
    <text x="528" y="14" class="legend-text">Internal call</text>

    <path d="M660,9 L710,9" class="arrow-dashed" />
    <text x="718" y="14" class="legend-text">External API / network call</text>
  </g>
</svg>
